version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: truthlens-postgres
    restart: always
    environment:
      POSTGRES_DB: truthlens
      POSTGRES_USER: truthlens_user
      POSTGRES_PASSWORD: Buildathon2026!
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - truthlens-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truthlens_user -d truthlens"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: truthlens-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - truthlens-net

  redis:
    image: redis:7-alpine
    container_name: truthlens-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - truthlens-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truthlens-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://truthlens_user:Buildathon2026!@postgres:5432/truthlens
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SHARED_MEDIA_DIR=/shared/media
    volumes:
      - ./backend:/app
      - vault_data:/app/vault_store
      - shared_media:/shared/media
    networks:
      - truthlens-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: truthlens-openwa
    restart: always
    ports:
      - "2785:2785"
    environment:
      - PORT=2785
      - NODE_ENV=production
      - CSP_UPGRADE_INSECURE_REQUESTS=false
      - DATABASE_TYPE=sqlite
      - DATABASE_NAME=/app/data/openwa.sqlite
      - DATABASE_SYNCHRONIZE=true
      - ENGINE_TYPE=whatsapp-web.js
      - SESSION_DATA_PATH=/app/data/sessions
      - PUPPETEER_HEADLESS=true
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      - WEBHOOK_GLOBAL_URL=http://backend:8000/api/ingest/webhook
    volumes:
      - openwa_data:/app/data
    networks:
      - truthlens-net

  mixpost-db:
    image: mariadb:10.11
    container_name: truthlens-mixpost-db
    restart: always
    environment:
      MYSQL_DATABASE: mixpost_db
      MYSQL_USER: mixpost_user
      MYSQL_PASSWORD: Buildathon2026!
      MYSQL_ROOT_PASSWORD: Buildathon2026!
    volumes:
      - mixpost_db_data:/var/lib/mysql
    networks:
      - truthlens-net

  mixpost:
    image: inovector/mixpost:latest
    container_name: truthlens-mixpost
    restart: always
    ports:
      - "9000:80"
    environment:
      - APP_NAME=TruthLens Social Broadcast
      - APP_KEY=base64:HK/S/Z7sYMXWpyLv0LUylrZ4kzeQOh4WOhIMHubOLwY=
      - APP_DEBUG=false
      - APP_URL=http://100.70.108.107:9000
      - DB_CONNECTION=mysql
      - DB_HOST=mixpost-db
      - DB_PORT=3306
      - DB_DATABASE=mixpost_db
      - DB_USERNAME=mixpost_user
      - DB_PASSWORD=Buildathon2026!
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - mixpost_storage:/var/www/html/storage/app
      - mixpost_logs:/var/www/html/storage/logs
    depends_on:
      - mixpost-db
      - redis
    networks:
      - truthlens-net

volumes:
  pg_data:
    name: truthlens_pg_data
  qdrant_data:
    name: truthlens_qdrant_data
  redis_data:
    name: truthlens_redis_data
  vault_data:
    name: truthlens_vault_data
  shared_media:
    name: truthlens_shared_media
  openwa_data:
    name: truthlens_openwa_data
  mixpost_db_data:
    name: truthlens_mixpost_db_data
  mixpost_storage:
    name: truthlens_mixpost_storage
  mixpost_logs:
    name: truthlens_mixpost_logs

networks:
  truthlens-net:
    name: truthlens-net
    driver: bridge
